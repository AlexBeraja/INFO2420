<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project 6 Graphics</title>

    <!-- IMAGE SWAP & ROLLOVER PRELOAD -->
    <script type="text/javascript">
        function preloadImages() {
            var images = [
                "Images/Print2.jpg",
                "Images/BackyardBirdLogo2.jpg",
                "Images/fullsize/Image1Lg.jpg",
                "Images/fullsize/Image2Lg.jpg",
                "Images/fullsize/Image3Lg.jpg",
                "Images/fullsize/Image4Lg.jpg"
            ];
            for (var i = 0; i < images.length; i++) {
                var img = new Image();
                img.src = images[i];
            }
        }

        // IMAGE SWAP ARRAYS
        var imgArray = [
            "Images/fullsize/Image1Lg.jpg",
            "Images/fullsize/Image2Lg.jpg",
            "Images/fullsize/Image3Lg.jpg",
            "Images/fullsize/Image4Lg.jpg"
        ];

        var titleArray = [
            "Image 1 Description",
            "Image 2 Description",
            "Image 3 Description",
            "Image 4 Description"
        ];

        function swapImage(index) {
            document.getElementById("bigImage").src = imgArray[index];
            document.getElementById("title").innerHTML = titleArray[index];
        }
    </script>

    <!-- IMAGE SWAP & PAGE STYLING -->
    <style>
        #thumbs, #image {
            width: 700px;
            border: 1px solid #000;
            text-align: center;
            margin: 0 auto;
            background: #eee;
            padding: 5px;
        }
        #thumbs { margin-top: 10px; }
        #thumbs img {
            border: 1px solid #000;
            margin: 5px;
            cursor: pointer;
        }
        #image { height: 400px; }
        .instructions { font-style: italic; }
    </style>
</head>

<body onload="preloadImages()">

<h1>Project 6 – Graphics Page</h1>

<!-- ✅ PRINT BUTTON ROLLOVER -->
<div>
    <a href=""
       onmouseover="document.getElementById('print').src='Images/Print2.jpg'"
       onmouseout="document.getElementById('print').src='Images/Print1.jpg'">

        <img src="Images/Print1.jpg"
             width="200"
             height="50"
             alt="Print Page"
             id="print">

    </a>
</div>


<!-- ✅ LOGO ROLLOVER -->
<div>
    <a href=""
       onmouseover="document.getElementById('logo').src='Images/Logo2.jpg'"
       onmouseout="document.getElementById('logo').src='Images/Logo1.jpg'">

        <img src="Images/Logo1.jpg"
             alt="Company Logo"
             id="logo">
    </a>
</div>


<!-- ✅ IMAGE SWAP SYSTEM -->
<h2>Image Swap</h2>
<p class="instructions) -->
<h2>Two‑Column Background Image</h2>
<img src="Images/2colback.jpg" alt="Two Column Background" width="900" height="150">

</body>
</html>
